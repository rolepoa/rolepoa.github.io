    /**
     * Extrai apenas gêneros musicais a partir de uma string separada por ";",
     * descartando bairros, locais ou termos não musicais.
     */
    function extractMusicalGenres(rawTags, fallbackVibe = '') {
      const items = String(rawTags || '')
        .split(';')
        .map((item) => item.trim())
        .filter(Boolean);

      const seen = new Set();
      const genres = items
        .filter((item) => !NON_GENRE_TOKENS.has(item.toLowerCase()))
        .map((item) => item.charAt(0).toUpperCase() + item.slice(1))
        .filter((item) => {
          const k = item.toLowerCase();
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
      if (genres.length > 0) return genres;

      // Fallback simples caso a coluna tags não tenha gêneros explícitos
      const vibeLower = String(fallbackVibe || '').toLowerCase();
      const detected = [];
      if (vibeLower.includes('techno')) detected.push('Techno');
      if (vibeLower.includes('house')) detected.push('House');
      if (vibeLower.includes('funk')) detected.push('Funk');
      if (vibeLower.includes('samba')) detected.push('Samba');
      if (vibeLower.includes('rap')) detected.push('Rap');
      if (vibeLower.includes('latino')) detected.push('Latino');
      if (vibeLower.includes('eletrô') || vibeLower.includes('eletro')) detected.push('Eletrônico');
      if (vibeLower.includes('carnaval')) detected.push('Carnaval');
      return detected.length > 0 ? detected : ['Música'];
    }

    /**
     * Parser simples de CSV com suporte a aspas duplas para evitar quebra
     * quando descrições ou links contêm vírgulas.
     */
    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(field.trim());
          field = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(field.trim());
          if (row.some((cell) => cell !== '')) {
            rows.push(row);
          }
          row = [];
          field = '';
        } else {
          field += char;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field.trim());
        if (row.some((cell) => cell !== '')) {
          rows.push(row);
        }
      }

      if (rows.length < 2) return [];

      const headers = rows[0].map((h) => h.trim());
      const indexOf = (name) => headers.indexOf(name);

      return rows.slice(1).map((cols, idx) => {
        const get = (colName) => {
          const pos = indexOf(colName);
          return pos >= 0 && pos < cols.length ? cols[pos].trim() : '';
        };

        const vibe = get('vibe');
        const tags = get('tags');

        return {
          id: get('id') || String(idx + 1),
          title: get('title') || `Evento ${idx + 1}`,
          neighborhood: get('neighborhood') || 'Porto Alegre',
          dayLabel: get('dayLabel') || 'Em breve',
          dayKey: (get('dayKey') || 'all').toLowerCase(),
          date: get('date'),
          priceLabel: get('priceLabel') || 'Consultar',
          isFree: String(get('isFree')).toUpperCase() === 'TRUE',
          vibe,
          genres: extractMusicalGenres(tags, vibe),
          image: get('image') || 'https://placehold.co/900x600/18181b/f97316?text=ROLE+POA',
          url: get('url') || '#topo',
          mapsUrl: get('mapsUrl') || 'https://maps.google.com/?q=Porto+Alegre+RS',
          description: get('description') || vibe || 'Confira os detalhes na página oficial do evento.'
        };
      });
    }

    /**
     * Carrega eventos da URL CSV se configurada; caso contrário ou em erro,
     * mantém a lista local intacta sem interromper a renderização.
     */
    async function loadEvents() {
      if (!CSV_URL) {
        state.events = [...FALLBACK_EVENTS];
        renderAll();
        return;
      }

      try {
        const separator = CSV_URL.includes('?') ? '&' : '?';
        const response = await fetch(`${CSV_URL}${separator}_t=${Date.now()}`, {
          cache: 'no-store'
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const parsed = parseCSV(text);
        if (parsed.length > 0) {
          state.events = parsed;
          hideStatusBanner();
        } else {
          state.events = [...FALLBACK_EVENTS];
        }
      } catch (err) {
        console.warn('Falha ao carregar CSV externo, mantendo dados locais:', err);
        state.events = [...FALLBACK_EVENTS];
        showStatusBanner('Exibindo agenda local atualizada.');
      }

      renderAll();
    }

    function showStatusBanner(msg) {
      const banner = document.getElementById('status-banner');
      if (!banner) return;
      banner.textContent = msg;
      banner.classList.remove('hidden');
    }

    function hideStatusBanner() {
      const banner = document.getElementById('status-banner');
      if (!banner) return;
      banner.textContent = '';
      banner.classList.add('hidden');
    }

    /**
     * Coleta gêneros musicais únicos presentes nos eventos atuais.
     */
    function getAvailableGenres() {
      const set = new Set();
      getUpcomingEvents().forEach((ev) => {
        (ev.genres || []).forEach((g) => {
          if (g && g.trim()) set.add(g.trim());
        });
      });
      return ['all', ...Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'))];
    }

    /**
     * Filtra eventos por dia da semana, gênero musical e termo de busca.
     */
    /** Lê datas como 21/11 ou 21/11/2026. Sem ano, assume o ano atual (ou o próximo). */
    function parseEventDate(str) {
      const m = String(str || '').match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
      if (!m) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let year = m[3] ? Number(m[3]) : today.getFullYear();
      if (year < 100) year += 2000;
      let d = new Date(year, Number(m[2]) - 1, Number(m[1]));
      if (!m[3] && d < new Date(today.getTime() - 180 * 86400000)) {
        d = new Date(year + 1, Number(m[2]) - 1, Number(m[1]));
      }
      return d;
    }

    /** Eventos de hoje em diante, ordenados por data (sem data vão para o fim). */
    function getUpcomingEvents() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return state.events
        .map((ev, i) => ({ ev, i, d: parseEventDate(ev.date) }))
        .filter(({ d }) => !d || d >= today)
        .sort((a, b) => {
          if (a.d && b.d) return a.d - b.d || a.i - b.i;
          if (a.d) return -1;
          if (b.d) return 1;
          return a.i - b.i;
        })
        .map(({ ev }) => ev);
    }

    /** Remove do título a data repetida (ex.: "| SÁBADO 28/11"), pois ela já aparece na etiqueta. */
    function cleanTitle(ev) {
      if (!ev.date) return ev.title;
      const cleaned = String(ev.title).replace(
        /\s*(\|\s*)?(?:(?:segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)\s*)?\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$/i,
        ''
      ).trim();
      return cleaned || ev.title;
    }

    /** Só mostra preço quando há um valor de verdade (não "Ingressos"/"Consultar"). */
    function hasPrice(ev) {
      if (ev.isFree) return true;
      const label = String(ev.priceLabel || '').trim();
      return label !== '' && !/^(ingressos?|consultar)$/i.test(label);
    }

    function getFilteredEvents() {
      const query = state.searchQuery.trim().toLowerCase();

      return getUpcomingEvents().filter((ev) => {
        const matchesDay =
          state.selectedDay === 'all' ||
          String(ev.dayKey || '').toLowerCase() === state.selectedDay;

        const matchesGenre =
          state.selectedGenre === 'all' ||
          (ev.genres || []).some(
            (g) => g.toLowerCase() === state.selectedGenre.toLowerCase()
          );

        const searchableText = [
          ev.title,
          ev.neighborhood,
          ev.vibe,
          ev.description,
          ...(ev.genres || [])
        ]
          .join(' ')
          .toLowerCase();

        const matchesQuery = !query || searchableText.includes(query);

        return matchesDay && matchesGenre && matchesQuery;
      });
    }

    function renderDayFilters() {
      const container = document.getElementById('day-filters');
      if (!container) return;

      container.innerHTML = '';
      DAY_OPTIONS.forEach((opt) => {
        const active = state.selectedDay === opt.key;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = opt.label;
        btn.className = active
          ? 'rounded-xl bg-orange-500 px-3.5 py-2 text-xs font-bold text-zinc-950 transition sm:text-sm'
          : 'rounded-xl border border-zinc-800 bg-zinc-950/70 px-3.5 py-2 text-xs font-medium text-zinc-300 transition hover:border-zinc-700 hover:text-white sm:text-sm';

        btn.addEventListener('click', () => {
          state.selectedDay = opt.key;
          renderAll();
        });

        container.appendChild(btn);
      });
    }

    function renderGenreFilters() {
      const container = document.getElementById('genre-filters');
      if (!container) return;

      const genres = getAvailableGenres();
      if (!genres.includes(state.selectedGenre)) {
        state.selectedGenre = 'all';
      }

      container.innerHTML = '';
      genres.forEach((genre) => {
        const active = state.selectedGenre.toLowerCase() === genre.toLowerCase();
        const label = genre === 'all' ? 'Todos os gêneros' : genre;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = label;
        btn.className = active
          ? 'shrink-0 whitespace-nowrap rounded-full bg-orange-500 px-3.5 py-1.5 text-xs font-bold text-zinc-950 transition'
          : 'shrink-0 whitespace-nowrap rounded-full border border-zinc-800 bg-zinc-950/70 px-3.5 py-1.5 text-xs font-medium text-zinc-300 transition hover:border-orange-500/50 hover:text-white';

        btn.addEventListener('click', () => {
          state.selectedGenre = genre;
          renderAll();
        });

        container.appendChild(btn);
      });
    }

    function renderEventsGrid() {
      const grid = document.getElementById('events-grid');
      const countEl = document.getElementById('events-count');
      if (!grid) return;

      const filtered = getFilteredEvents();
      if (countEl) {
        countEl.textContent = String(filtered.length);
      }

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full rounded-2xl border border-dashed border-zinc-800 bg-zinc-900/50 p-8 text-center">
            <p class="text-base font-semibold text-white">Nenhum evento encontrado para esse filtro.</p>
            <p class="mt-1 text-sm text-zinc-400">Tente outro gênero musical, dia ou limpe a busca.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((ev) => {
        const card = document.createElement('article');
        card.className =
          'group flex flex-col overflow-hidden rounded-2xl border border-zinc-800/90 bg-zinc-900 transition hover:border-orange-500/50 hover:shadow-xl hover:shadow-orange-500/5';

        const imgWrapper = document.createElement('div');
        imgWrapper.className = 'relative h-40 w-full overflow-hidden bg-zinc-950';

        const img = document.createElement('img');
        img.src = ev.image;
        img.alt = ev.title;
        img.loading = 'lazy';
        img.className = 'h-full w-full object-cover object-top transition duration-300 group-hover:scale-105';
        img.onerror = function () {
          this.onerror = null;
          this.src = `https://placehold.co/900x600/18181b/f97316?text=${encodeURIComponent(ev.title)}`;
        };

        const dayBadge = document.createElement('span');
        dayBadge.className =
          'absolute left-3 top-3 rounded-lg bg-zinc-950/85 px-2.5 py-1 text-xs font-bold text-white backdrop-blur-sm';
        dayBadge.textContent = ev.dayLabel;

        const priceBadge = document.createElement('span');
        priceBadge.className =
          'absolute bottom-3 right-3 rounded-lg bg-orange-500 px-2.5 py-1 text-xs font-extrabold text-zinc-950 shadow';
        priceBadge.textContent = ev.isFree ? 'Gratuito' : ev.priceLabel;

        imgWrapper.appendChild(img);
        imgWrapper.appendChild(dayBadge);
        if (hasPrice(ev)) imgWrapper.appendChild(priceBadge);

        const body = document.createElement('div');
        body.className = 'flex flex-1 flex-col justify-between p-4 sm:p-5';

        const topContent = document.createElement('div');

        // Exibe exclusivamente os gêneros musicais (sem categoria de tipo de evento)
        const genresRow = document.createElement('div');
        genresRow.className = 'mb-2 flex flex-wrap gap-1.5';
        (ev.genres || []).forEach((genre) => {
          const pill = document.createElement('span');
          pill.className =
            'rounded-md border border-orange-500/25 bg-orange-500/10 px-2 py-0.5 text-[11px] font-semibold text-orange-300';
          pill.textContent = genre;
          genresRow.appendChild(pill);
        });

        const titleEl = document.createElement('h2');
        titleEl.className = 'line-clamp-2 text-lg font-bold leading-snug text-white';
        titleEl.textContent = cleanTitle(ev);
        if (ev.date) {
  const dateEl = document.createElement('span');
  dateEl.className = 'ml-2 whitespace-nowrap rounded-full bg-orange-500/15 px-2 py-0.5 align-middle text-xs font-semibold text-orange-300';
  dateEl.textContent = ev.date;
  titleEl.appendChild(dateEl);
}
        const neighborhoodEl = document.createElement('p');
        neighborhoodEl.className = 'mt-1 text-xs font-medium text-zinc-400';
        neighborhoodEl.textContent = `📍 ${ev.neighborhood}`;

        const vibeEl = document.createElement('p');
        vibeEl.className = 'mt-2.5 line-clamp-2 text-sm text-zinc-300';
        vibeEl.textContent = ev.vibe || ev.description;

        topContent.appendChild(genresRow);
        topContent.appendChild(titleEl);
        topContent.appendChild(neighborhoodEl);
        topContent.appendChild(vibeEl);

        const actionsRow = document.createElement('div');
        actionsRow.className = 'mt-4 flex items-center gap-2 border-t border-zinc-800/80 pt-3.5';

        const detailsBtn = document.createElement('button');
        detailsBtn.type = 'button';
        detailsBtn.className =
          'flex-1 rounded-xl border border-zinc-700 bg-zinc-800 px-3 py-2 text-xs font-semibold text-white transition hover:bg-zinc-700';
        detailsBtn.textContent = 'Detalhes';
        detailsBtn.addEventListener('click', () => openEventModal(ev));

        const ticketLink = document.createElement('a');
        ticketLink.href = ev.url;
        ticketLink.target = '_blank';
        ticketLink.rel = 'noopener noreferrer';
        ticketLink.className =
          'flex-1 rounded-xl bg-orange-500 px-3 py-2 text-center text-xs font-bold text-zinc-950 transition hover:bg-orange-400';
        ticketLink.textContent = 'Ingressos';

        actionsRow.appendChild(detailsBtn);
        actionsRow.appendChild(ticketLink);

        body.appendChild(topContent);
        body.appendChild(actionsRow);

        card.appendChild(imgWrapper);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

    function openEventModal(ev) {
      const modal = document.getElementById('event-modal');
      if (!modal || !ev) return;

      const modalImg = document.getElementById('modal-image');
      const modalGenres = document.getElementById('modal-genres');
      const modalTitle = document.getElementById('modal-title');
      const modalMeta = document.getElementById('modal-meta');
      const modalVibe = document.getElementById('modal-vibe');
      const modalDesc = document.getElementById('modal-description');
      const modalTicket = document.getElementById('modal-ticket-link');
      const modalMap = document.getElementById('modal-map-link');

      if (modalImg) {
        modalImg.src = ev.image;
        modalImg.alt = ev.title;
        modalImg.onerror = function () {
          this.onerror = null;
          this.src = `https://placehold.co/900x600/18181b/f97316?text=${encodeURIComponent(ev.title)}`;
        };
      }

      if (modalGenres) {
        modalGenres.innerHTML = '';
        (ev.genres || []).forEach((g) => {
          const span = document.createElement('span');
          span.className =
            'rounded-md border border-orange-500/30 bg-orange-500/10 px-2.5 py-1 text-xs font-semibold text-orange-300';
          span.textContent = g;
          modalGenres.appendChild(span);
        });
      }

      if (modalTitle) modalTitle.textContent = cleanTitle(ev);
      if (modalMeta) {
        const priceText = ev.isFree ? 'Gratuito' : hasPrice(ev) ? ev.priceLabel : '';
        modalMeta.textContent = [ev.date, ev.dayLabel, `📍 ${ev.neighborhood}`, priceText]
          .filter(Boolean)
          .join(' · ');
      }
      if (modalVibe) modalVibe.textContent = ev.vibe || '';
      if (modalDesc) modalDesc.textContent = ev.description || '';
      if (modalTicket) modalTicket.href = ev.url || '#topo';
      if (modalMap) modalMap.href = ev.mapsUrl || 'https://maps.google.com/?q=Porto+Alegre+RS';

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeEventModal() {
      const modal = document.getElementById('event-modal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function renderAll() {
      try {
        renderDayFilters();
        renderGenreFilters();
        renderEventsGrid();
      } catch (err) {
        console.error('Erro ao renderizar eventos:', err);
      }
    }

    function bindUIEvents() {
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value || '';
          renderEventsGrid();
        });
      }

      const clearBtn = document.getElementById('btn-clear-filters');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          state.selectedDay = 'all';
          state.selectedGenre = 'all';
          state.searchQuery = '';
          if (searchInput) searchInput.value = '';
          renderAll();
        });
      }

      const refreshBtn = document.getElementById('btn-refresh');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', async () => {
          const icon = document.getElementById('refresh-icon');
          if (icon) icon.classList.add('animate-spin');
          await loadEvents();
          if (icon) icon.classList.remove('animate-spin');
        });
      }

      const modalClose = document.getElementById('modal-close');
      const modal = document.getElementById('event-modal');
      if (modalClose) modalClose.addEventListener('click', closeEventModal);
      if (modal) {
        modal.addEventListener('click', (e) => {
          if (e.target === modal) closeEventModal();
        });
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeEventModal();
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      bindUIEvents();
      loadEvents();
    });
  </script>
</body>
